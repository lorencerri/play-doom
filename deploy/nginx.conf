# Deploy target for the rebuilt app. Supersedes scripts/plexidev.org, which is left
# in place as a record of the previous config rather than deleted.
#
# The old note here asked where TLS terminated. Answered: the path is
# Cloudflare -> nginx -> app. nginx on the box holds a Cloudflare *origin* certificate
# (/etc/ssl/cloudflare/plexidev.pem), which is a wildcard for *.plexidev.org valid to
# 2041 — so a new subdomain needs no certificate work, only a DNS record.
#
# The rewrite runs alongside the original rather than replacing it: this serves
# doom-api-v2.plexidev.org on its own port, while doom-api.plexidev.org keeps pointing
# at the old app on 6677 until the cutover.
#
# One thing to keep if this is edited: CF-Connecting-IP must be passed through.
# X-Real-IP is the Cloudflare edge behind Cloudflare, not the visitor, so dropping the
# real header would collapse every player into a handful of addresses in the unique
# player count (see src/http/client.ts).
#
# Still to land, once the pieces they depend on exist:
#   - an `internal` location serving data/ artifacts via X-Accel-Redirect, so nginx
#     streams video/image bytes and the app is never on that path (§1.6)

server {
	listen 80;
	listen [::]:80;

	server_name doom-api-v2.plexidev.org;

	# Cloudflare talks to the origin over TLS; this exists only so a plain-http
	# request does not silently serve the app unencrypted.
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name doom-api-v2.plexidev.org;

	ssl_certificate     /etc/ssl/cloudflare/plexidev.pem;
	ssl_certificate_key /etc/ssl/cloudflare/plexidev.key;

	# Videos are the whole archive of a namespace and run to hundreds of megabytes.
	client_max_body_size 0;
	proxy_max_temp_file_size 0;

	location /health {
		proxy_pass http://127.0.0.1:6678;
		access_log off;
	}

	location / {
		proxy_pass http://127.0.0.1:6678;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# The only header that carries the actual visitor. Do not drop it.
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

		# Range requests, so a large archive video can be scrubbed rather than
		# downloaded whole. The app implements 206 itself (src/http/serve.ts).
		proxy_buffering off;

		# A render takes ~250ms, but a cold archive fold is disk-bound on a file that
		# grows with every run, so the default 60s read timeout is not enough.
		proxy_read_timeout 600s;
	}
}
