# Deploy target for the rebuilt app. Supersedes scripts/plexidev.org, which is left
# in place as a record of the previous config rather than deleted.
#
# OPEN QUESTION, carried over from the old config: this only defines port 80, but
# the app is served over https://doom-api.plexidev.org — TLS terminates somewhere
# not captured in this repo (Cloudflare, or another vhost on the box). Confirm
# where before wiring this in, or the cutover breaks TLS.
#
# Deliberately minimal for phase 1 (foundation only): plain proxy_pass to the app,
# nothing route-specific yet. Two things land later, once the routes they depend on
# exist:
#   - an `internal` location serving data/ artifacts directly via X-Accel-Redirect,
#     so nginx streams video/image bytes and the app is never on that path (§1.6)
#   - rate limits on the render-triggering endpoints (Part 2 reliability)

server {
	listen 80;
	listen [::]:80;

	server_name doom-api.plexidev.org;

	location /health {
		proxy_pass http://127.0.0.1:6677;
		access_log off;
	}

	location / {
		proxy_pass http://127.0.0.1:6677;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		expires off;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}
}
