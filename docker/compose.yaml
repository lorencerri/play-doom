services:
  play-doom:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6677:6677"
    environment:
      LOG_LEVEL: info
      RENDER_CONCURRENCY: 2
    volumes:
      - ../data:/app/data
      # doom1.wad is shareware and deliberately not in the repo, so its location is
      # operator-specific. Override with DOOM1_WAD_PATH in docker/.env if it lives
      # somewhere else on the host.
      - ${DOOM1_WAD_PATH:-../vendor/doomreplay/doom1.wad}:/app/vendor/doomreplay/doom1.wad:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:6677/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
